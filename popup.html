<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="cropper.min.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-title">
      <h2>Ozon Matcher</h2>
    </div>
    <div class="header-actions">
      <button id="change-icon-btn" type="button" title="Change Extension Icon">🎨 Icon</button>
      <button id="history-btn" type="button" title="View Match History">🕒 History</button>
    </div>
  </header>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div id="scan-counter" class="stat-item" style="display: none;">Scanned: <span id="scan-count-val">0</span></div>
    <div id="scan-timer-container" class="stat-item" style="display: none;">Time: <span id="scan-time-val">0.0s</span></div>
  </div>

  <!-- Main Actions -->
  <div class="action-bar">
    <button id="start-btn" type="button" disabled>Start Scan</button>
    <button id="continue-scan-btn" type="button" style="display:none;">Not this one? Continue Scan</button>
    <button id="pause-btn" class="btn-warning" style="display:none;">⏸ Pause</button>
    <button id="stop-btn" class="btn-danger" style="display:none;">Stop Scan</button>
  </div>

  <!-- Search Term -->
  <div class="input-group">
    <label for="search-term">Search Term</label>
    <div class="search-row">
      <input type="text" id="search-term" placeholder="e.g. беспроводная зарядка">
      <button id="paste-text-btn" type="button" class="btn-icon" title="Paste text from clipboard">📋</button>
      <button id="clear-btn" type="button" class="btn-secondary">Clear</button>
    </div>
  </div>

  <!-- Reference Image -->
  <div class="input-group">
    <label>Reference Image</label>
    <div id="drop-zone" class="drop-zone">
      <span class="placeholder">Click to upload or paste image</span>
      <div class="image-wrapper">
        <img id="preview-img" style="display:none;" />
        <div id="image-actions" class="image-actions" style="display:none;">
          <button id="auto-trim-btn" class="action-btn" type="button" title="Auto-Trim Borders">🪄</button>
          <button id="crop-btn" class="action-btn" type="button" title="Manual Crop">✂️</button>
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*" style="display:none;">
    </div>
  </div>

  <!-- Settings -->
  <div class="input-group">
    <label for="threshold">Match Threshold: <span id="threshold-val">65%</span></label>
    <input type="range" id="threshold" min="30" max="100" value="65">
    <div class="threshold-marks">
      <span data-val="65">65</span>
      <span data-val="75">75</span>
      <span data-val="80">80</span>
      <span data-val="90">90</span>
    </div>
    <div class="hint">Lower this if your reference image has badges or extra text.</div>
  </div>

  <div class="input-group toggle-row">
    <label for="notifications-toggle" style="margin: 0; cursor: pointer;">Enable Notifications</label>
    <input type="checkbox" id="notifications-toggle" checked>
  </div>
  
  <div id="status" class="status">Waiting for input...</div>

  <!-- Modals -->
  <div id="crop-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="crop-container">
        <img id="crop-image" />
      </div>
      <div class="modal-actions">
        <button id="cancel-crop-btn" type="button">Cancel</button>
        <button id="save-crop-btn" type="button">Save Crop</button>
      </div>
    </div>
  </div>

  <div id="history-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3 class="modal-header">Match History (Last 5)</h3>
      <div id="history-list" class="modal-body">
      </div>
      <div class="modal-actions">
        <button id="close-history-btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="cropper.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
